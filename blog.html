<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse independent PRINCE2 guides, explanations and study resources." />
  <link rel="canonical" href="https://example.com/blog.html" />
  <title>PRINCE2 Articles — PRINCE2 Guide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="site-header glass glass-1">
    <a class="brand" href="index.html"><span class="brand-mark">P2</span><span>PRINCE2 <em>Guide</em></span></a>
    <nav class="desktop-nav" aria-label="Primary"><a href="index.html">Home</a><a href="blog.html" class="active">Articles</a><a href="about.html">About</a></nav>
    <div class="header-actions"><button class="icon-btn" data-search-open aria-label="Search articles">⌕</button><button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode">◐</button><button class="icon-btn mobile-menu-btn" data-menu-open aria-label="Open menu">☰</button></div>
  </header>

  <main class="container archive-page">
    <section class="archive-hero"><p class="eyebrow">THE LIBRARY</p><h1>PRINCE2 Articles</h1><p>Guides, explanations and practical resources for understanding PRINCE2.</p></section>
    <section class="archive-controls glass glass-1">
      <div class="archive-search"><span>⌕</span><input id="archive-search" type="search" placeholder="Search articles..." /></div>
      <div id="category-filters" class="filter-row"></div>
    </section>
    <div class="archive-count"><span id="result-count"></span></div>
    <section id="article-grid" class="archive-list"></section>
  </main>

  <footer class="site-footer glass glass-1"><div><div class="brand footer-brand"><span class="brand-mark">P2</span><span>PRINCE2 <em>Guide</em></span></div><p>Independent educational resources for PRINCE2 learners.</p></div><div class="footer-links"><a href="index.html">Home</a><a href="blog.html">Articles</a><a href="about.html">About</a><a href="#" onclick="return false">Privacy</a></div><div class="footer-note">© 2026 PRINCE2 Guide</div></footer>
  <div class="search-overlay" data-search-overlay aria-hidden="true"><div class="search-backdrop" data-search-close></div><div class="search-panel glass glass-3"><div class="search-top"><span class="search-kicker">SEARCH</span><button class="icon-btn" data-search-close>✕</button></div><div class="search-input-wrap"><span>⌕</span><input id="global-search" type="search" placeholder="Search PRINCE2 articles..." /></div><div id="global-search-results" class="search-results"></div></div></div>
  <div class="mobile-menu-overlay" data-mobile-overlay aria-hidden="true"><div class="search-backdrop" data-menu-close></div><div class="mobile-menu glass glass-3"><div class="search-top"><span class="search-kicker">MENU</span><button class="icon-btn" data-menu-close>✕</button></div><a href="index.html">Home</a><a href="blog.html">Articles</a><a href="about.html">About</a></div></div>
  <script src="js/articles.js"></script><script src="js/main.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const state = { query: '', category: params.get('category') || 'All' };
    const grid = document.querySelector('#article-grid'); const count = document.querySelector('#result-count'); const search = document.querySelector('#archive-search'); const filters = document.querySelector('#category-filters');
    const cats = ['All', ...new Set(ARTICLES.flatMap(a=>a.categories))];
    cats.forEach(cat => filters.insertAdjacentHTML('beforeend', `<button class="filter-pill ${state.category===cat?'active':''}" data-cat="${cat}">${cat}</button>`));
    function render(){ const q=state.query.toLowerCase().trim(); const items=ARTICLES.filter(a=>(state.category==='All'||a.categories.includes(state.category)) && (!q||[a.title,a.excerpt,a.category,...a.categories,a.keywords].join(' ').toLowerCase().includes(q))); count.textContent=`${items.length} ${items.length===1?'article':'articles'}`; grid.innerHTML=items.map(articleRow).join('')||`<div class="empty-state glass glass-1"><h3>No articles found</h3><p>Try a different topic or search term.</p></div>`; filters.querySelectorAll('.filter-pill').forEach(b=>b.classList.toggle('active',b.dataset.cat===state.category)); }
    filters.addEventListener('click',e=>{const b=e.target.closest('.filter-pill'); if(!b)return; state.category=b.dataset.cat; render();});
    search.addEventListener('input',e=>{state.query=e.target.value; render();}); render();
  </script>
</body>
</html>
