    const id = new URLSearchParams(location.search).get('id') || 'what-is-prince2';

    const toc = document.querySelector('#toc-links'); const h2s=[...document.querySelectorAll('#article-body h2')]; h2s.forEach((h,i)=>{h.id=`section-${i+1}`; toc.insertAdjacentHTML('beforeend',`<a href="#${h.id}">${String(i+1).padStart(2,'0')} ${h.textContent}</a>`)});
    const progress=document.querySelector('#progress-bar');
    const updateProgress=()=>{const doc=document.documentElement; const max=doc.scrollHeight-innerHeight; progress.style.width=(max>0?(scrollY/max)*100:0)+'%';}; addEventListener('scroll',updateProgress,{passive:true}); updateProgress();
    const obs=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){document.querySelectorAll('#toc-links a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id));}}),{rootMargin:'-35% 0px -55% 0px'}); h2s.forEach(h=>obs.observe(h));
